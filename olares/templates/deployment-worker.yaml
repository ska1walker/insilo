# ============================================================================
# Deployment: Insilo Celery Worker
#
# Nutzt dasselbe Container-Image wie Backend, nur mit anderem Startbefehl.
# Lauscht auf KVRocks-Queue und orchestriert: Transcribe -> Summarize -> Embed.
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: insilo-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app: insilo
    component: worker
spec:
  replicas: {{ (index .Values.workloads "insilo-worker").replicaCount }}
  # Recreate wegen hostPath-Mounts (/app/data, /app/cache) — siehe
  # deployment-backend.yaml. Markt lehnt hostPath + RollingUpdate ab.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: insilo
      component: worker
  template:
    metadata:
      labels:
        app: insilo
        component: worker
    spec:
      initContainers:
        # hostPath mounts at /app/{cache,data} are owned by root on the host;
        # the main container runs as uid 1000 and the Dockerfile-chown gets
        # shadowed by the mount overlay. Chown the mount before the app starts.
        - name: init-chown
          image: docker.io/beclab/aboveos-busybox:1.37.0
          # /app/common ist der geteilte appCommon-Ordner — er gehört
          # **allen** Apps, die ihn anfordern, nicht Insilo. Übernommen
          # wird deshalb nur der eigene Unterordner, nie die oberste Stufe:
          # ein `chown` dort bei jedem Start zöge anderen Apps mit anderer
          # Kennung den Boden unter ihren eigenen Ordnern weg. Anlegen darf
          # der Init-Container ohnehin, er läuft als root.
          #
          # Lesen kann Relay trotzdem: `mkdir` unter root legt 0755 an,
          # die Dateien entstehen mit 0644.
          {{- if (.Values.userspace).appCommon }}
          command: ['sh', '-c', 'chown -R 1000:1000 /app/cache /app/data && mkdir -p /app/common/insilo-meetings && chown 1000:1000 /app/common/insilo-meetings']
          {{- else }}
          command: ['sh', '-c', 'chown -R 1000:1000 /app/cache /app/data']
          {{- end }}
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: app-cache
              mountPath: /app/cache
            - name: app-data
              mountPath: /app/data
            {{- if (.Values.userspace).appCommon }}
            - name: app-common
              mountPath: /app/common
            {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
          # `--beat` bringt den Zeitplaner im Worker-Prozess mit, statt
          # als zweites Deployment. Zulässig, weil genau ein Worker läuft
          # (`workloads.insilo-worker.replicaCount: 1` auf einer
          # Ein-Knoten-Box); bei mehreren Replikaten liefe der tägliche
          # Aufräum-Job mehrfach. Der Zeitplan steht in
          # `app/worker.py:beat_schedule`.
          #
          # Die Zustandsdatei des Beat gehört nach /app/cache: das
          # Arbeitsverzeichnis im Bild ist nicht beschreibbar, und der
          # Zeitplan ist wiederherstellbar — ein Verlust kostet einen
          # ausgelassenen Lauf, keine Daten.
          command:
            - "celery"
            - "-A"
            - "app.worker:celery_app"
            - "worker"
            - "--beat"
            - "--schedule=/app/cache/celerybeat-schedule"
            - "-l"
            - "info"
            - "--concurrency=2"
          env:
            # Gleiche Env-Variablen wie Backend (DB + Redis + Services)
            - name: DB_HOST
              value: "{{ .Values.postgres.host }}"
            - name: DB_PORT
              value: "{{ .Values.postgres.port }}"
            - name: DB_USER
              value: "{{ .Values.postgres.username }}"
            - name: DB_PASSWORD
              value: "{{ .Values.postgres.password }}"
            - name: DB_NAME
              value: "{{ .Values.postgres.databases.insilo }}"
            - name: REDIS_HOST
              value: "{{ .Values.redis.host }}"
            - name: REDIS_PORT
              value: "{{ .Values.redis.port }}"
            - name: REDIS_PASSWORD
              value: "{{ .Values.redis.password }}"
            - name: REDIS_NAMESPACE
              value: "{{ .Values.redis.namespace }}"
            - name: WHISPER_URL
              value: "http://insilo-whisper:8001"
            - name: LLM_BASE_URL
              value: "http://litellm-svc.litellm-{{ .Values.bfl.username }}.svc.cluster.local/v1"
            - name: LLM_API_KEY
              value: "{{ .Values.litellm.apiKey }}"
            - name: LLM_MODEL
              value: "{{ .Values.litellm.model }}"
            - name: EMBEDDINGS_URL
              value: "http://insilo-embeddings:8002"
            - name: APP_DATA_DIR
              value: "{{ .Values.userspace.appData }}"
            - name: APP_CACHE_DIR
              value: "{{ .Values.userspace.appCache }}"
            # Worker liest Audio aus dem gleichen hostPath wie das Backend.
            - name: STORAGE_BACKEND
              value: "local"
            - name: STORAGE_LOCAL_PATH
              value: "/app/data/audio"
            {{- if (.Values.userspace).appCommon }}
            # Gemeinsames Verzeichnis für den Relay-Export (appCommon).
            # Der Worker schreibt die Dateien beim Zusammenfassen.
            - name: MEETING_EXPORT_DIR
              value: "/app/common/insilo-meetings"
            {{- end }}

          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: app-cache
              mountPath: /app/cache
            {{- if (.Values.userspace).appCommon }}
            - name: app-common
              mountPath: /app/common
            {{- end }}

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi

      volumes:
        - name: app-data
          hostPath:
            path: {{ .Values.userspace.appData }}
            type: DirectoryOrCreate
        - name: app-cache
          hostPath:
            path: {{ .Values.userspace.appCache }}
            type: DirectoryOrCreate
        {{- if (.Values.userspace).appCommon }}
        - name: app-common
          hostPath:
            path: {{ .Values.userspace.appCommon }}
            type: DirectoryOrCreate
        {{- end }}
