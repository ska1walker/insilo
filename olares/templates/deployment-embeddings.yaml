# ============================================================================
# Deployment: Insilo Embeddings Service (BGE-M3)
#
# Generiert 1024-dim Embeddings für semantische Suche.
# CPU-only ist OK, GPU optional.
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: insilo-embeddings
  namespace: {{ .Release.Namespace }}
  labels:
    app: insilo
    component: embeddings
spec:
  replicas: 1
  # Recreate wegen hostPath-Mount (/app/cache, BGE-M3-Modell) — siehe
  # deployment-backend.yaml. Markt lehnt hostPath + RollingUpdate ab.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: insilo
      component: embeddings
  template:
    metadata:
      labels:
        app: insilo
        component: embeddings
    spec:
      initContainers:
        # See deployment-worker.yaml for why this is needed.
        - name: init-chown
          image: docker.io/beclab/aboveos-busybox:1.37.0
          command: ['sh', '-c', 'chown -R 1000:1000 /app/cache']
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: app-cache
              mountPath: /app/cache
      containers:
        - name: embeddings
          image: "{{ .Values.images.embeddings.repository }}:{{ .Values.images.embeddings.tag }}"
          imagePullPolicy: {{ .Values.images.embeddings.pullPolicy }}
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: EMBEDDINGS_MODEL
              value: "{{ .Values.models.embeddings }}"
            - name: MODELS_DIR
              value: "/app/cache/models"

          volumeMounts:
            - name: app-cache
              mountPath: /app/cache

          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi

          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10

      volumes:
        - name: app-cache
          hostPath:
            path: {{ .Values.userspace.appCache }}
            type: DirectoryOrCreate
