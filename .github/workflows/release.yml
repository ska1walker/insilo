name: release

# Build + push the four container images on every tag like v0.1.0.
# Images land at ghcr.io/<repo-owner>/insilo-<service>:<version>
# and are made public so the Olares box pulls them without secrets.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag without leading v (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: read
  packages: write

jobs:
  preflight:
    name: olares chart · sanity
    runs-on: ubuntu-latest
    outputs:
      build_images: ${{ steps.decide.outputs.build_images }}
    steps:
      - uses: actions/checkout@v4

      - name: install helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.2"

      - name: codified Phase-4 lessons (scripts/check-chart.sh)
        run: bash scripts/check-chart.sh

      - name: chart version must match the tag
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CHART_VERSION="$(grep -E '^version:' olares/Chart.yaml | head -1 | awk '{print $2}')"
          if [ "$TAG_VERSION" != "$CHART_VERSION" ]; then
            echo "::error::git tag $GITHUB_REF_NAME (=$TAG_VERSION) does not match olares/Chart.yaml version $CHART_VERSION"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches chart version $CHART_VERSION"

      # A `release.sh --chart-only` bump leaves values.yaml pointing at the
      # PREVIOUS image tags — the images this tag would build are then never
      # referenced by the chart. Skip the ~9-minute build in that case.
      # Fail-safe: anything unexpected (missing file, changed formatting)
      # falls through to building. If a build is skipped in error, rebuild
      # via workflow_dispatch with an explicit version.
      - name: are images needed for this tag?
        id: decide
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BUILD=true
          # Empty tags mean "follow Chart.AppVersion" — the normal case, and
          # the chart then references exactly this tag. A NON-empty tag is a
          # --chart-only pin: those images already exist, don't rebuild.
          if [ -f olares/values.yaml ]; then
            PINS="$(grep -E "^[[:space:]]+tag:" olares/values.yaml | grep -vE 'tag:[[:space:]]*(""|'"''"')[[:space:]]*$' || true)"
            if [ -n "$PINS" ] \
               && ! grep -qE "^[[:space:]]+tag:[[:space:]]*[\"']?${TAG_VERSION}[\"']?[[:space:]]*$" olares/values.yaml; then
              BUILD=false
            fi
          fi
          echo "build_images=$BUILD" >> "$GITHUB_OUTPUT"
          if [ "$BUILD" = "true" ]; then
            echo "### Images werden gebaut (\`$TAG_VERSION\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Image-Build übersprungen"
              echo "\`olares/values.yaml\` referenziert **nicht** \`$TAG_VERSION\` —"
              echo "sieht nach einem \`--chart-only\`-Release aus. Referenzierte Tags:"
              echo '```'
              grep -E "^[[:space:]]+tag:" olares/values.yaml | sort -u
              echo '```'
              echo "Falls das falsch ist: \`release\`-Workflow manuell mit expliziter Version starten."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: ${{ matrix.service }}
    needs: preflight
    if: needs.preflight.outputs.build_images == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: whisper
            context: ./services/whisper
            dockerfile: ./services/whisper/Dockerfile
          - service: embeddings
            context: ./services/embeddings
            dockerfile: ./services/embeddings/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Lowercase owner
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/insilo-${{ matrix.service }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.owner }}/insilo-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
