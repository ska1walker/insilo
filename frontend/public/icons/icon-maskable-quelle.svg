<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 160 160" fill="none" role="img" aria-label="Insilo">
<title>Insilo — Wappen mit Mikrofon, randlos für Android-Masken</title>
<!--
  Quelle: Figma AImighty, Datei vMiwfm3bnxWLjZLxdbDF8a, Seite
  „Icon-Labor", Abschnitt „0 — Icon-Set (final)"; Sandgrund und Wappen
  unverändert aus Knoten 301:164 („app goldgrund I").

  Seit 01.10.2026 (CI, ABGLEICH.md R5; medien/app.md „App-Icons — die
  Kacheln") trägt das Wappen das Zeichen der Anwendung statt des
  Monogramms „I": Insilo = Mikrofon, Lucide `mic` 1.31.0. Gezeichnet wie
  Rewind: 24er-Raster um 1,4 skaliert, mittig bei (80 | 78,5), also
  translate(63.2 61.7) scale(1.4); Strich 3,4 auf der Kachel (2,43 im
  24er-Raster), runde Enden, keine Füllung, Goldverlauf #dfc387 → #b89957
  (im 24er-Raster von y 2 bis 22).

  Maskable-Fassung: ohne Eckenrundung und ohne Kante, weil Android auf
  beliebige Formen beschneidet und seine eigene Maske setzt. Eine
  Verkleinerung braucht es nicht — das Schild reicht nur bis 51 von 64
  erlaubten Einheiten vom Mittelpunkt und liegt damit im garantierten
  Innenkreis (80 % Durchmesser).
-->
