name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart-checks:
    name: olares chart · sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.2"

      - name: codified Phase-4 lessons (scripts/check-chart.sh)
        run: bash scripts/check-chart.sh

  frontend:
    name: frontend · typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: install deps
        working-directory: frontend
        run: npm ci

      - name: type-check
        working-directory: frontend
        run: npm run type-check

      - name: tests
        working-directory: frontend
        run: npx vitest run

      - name: build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_USER: ci

  backend:
    name: backend · ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        working-directory: backend
        run: ruff check .

      - name: mypy
        working-directory: backend
        run: mypy app || true   # strict typing target — not blocking yet in phase 1

  oberflaeche:
    name: oberfläche · Rundgang im Browser
    runs-on: ubuntu-latest
    # Nach Rockets Job „oberfläche“ (CI-Anschluss, Etappe 7). Dort hing
    # „install browser“ einmal über 20 Minuten — ohne Grenze wären es sechs
    # Stunden gewesen.
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      PGHOST: localhost
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Wie auf der Box: Die Erweiterungen legt die Plattform an, die
      # Migrationen laufen mit der Rolle der Anwendung. Die ist kein
      # Superuser — sonst griffe die erzwungene Zeilensicherheit (0017) nicht.
      - name: database and migrations
        run: |
          PGPASSWORD=postgres psql -U postgres -c "create role insilo login password 'insilo_dev_only';"
          PGPASSWORD=postgres psql -U postgres -c "create database insilo owner insilo;"
          PGPASSWORD=postgres psql -U postgres -d insilo -c 'create extension if not exists "uuid-ossp"; create extension if not exists pgcrypto; create extension if not exists vector; create extension if not exists pg_trgm;'
          for f in supabase/migrations/*.sql; do
            PGPASSWORD=insilo_dev_only psql -q -v ON_ERROR_STOP=1 -U insilo -d insilo -f "$f"
          done
          PGPASSWORD=insilo_dev_only psql -q -v ON_ERROR_STOP=1 -U insilo -d insilo -f supabase/seed.sql

      - name: start backend
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: insilo
          DB_USER: insilo
          DB_PASSWORD: insilo_dev_only
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          STORAGE_BACKEND: local
          INSILO_AUTO_PROVISION: "true"
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          mkdir -p "$RUNNER_TEMP/audio" "$RUNNER_TEMP/cache"
          STORAGE_LOCAL_PATH="$RUNNER_TEMP/audio" STUECK_CACHE_DIR="$RUNNER_TEMP/cache" \
            nohup uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 1; done

      # Der erste Aufruf legt Nutzer und Organisation an (INSILO_AUTO_PROVISION),
      # danach die Besprechungen und ihre Tonspuren (e2e/beispiel/).
      - name: sample data
        run: |
          curl -sf -H 'X-Bfl-User: devuser' localhost:8000/api/v1/meetings > /dev/null
          PGPASSWORD=insilo_dev_only psql -q -v ON_ERROR_STOP=1 -U insilo -d insilo -f frontend/e2e/beispiel/daten.sql
          ORG=$(PGPASSWORD=insilo_dev_only psql -U insilo -d insilo -At -c "select org_id from user_org_roles limit 1")
          python frontend/e2e/beispiel/audio.py "$RUNNER_TEMP/audio" "$ORG"

      # Derselbe Weg wie auf der Box: Der Browser ruft /api/* am eigenen
      # Ursprung, middleware.ts reicht an INSILO_BACKEND_INTERNAL weiter.
      - name: build and start frontend
        working-directory: frontend
        env:
          INSILO_BACKEND_INTERNAL: http://localhost:8000
          NEXT_PUBLIC_API_URL: ""
          NEXT_PUBLIC_USER: devuser
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3020 > "$RUNNER_TEMP/frontend.log" 2>&1 &
          for i in $(seq 30); do curl -sf -o /dev/null localhost:3020/api/health && break; sleep 1; done

      # Der Browser liegt im Zwischenspeicher, Schlüssel ist die Version von
      # Playwright aus dem Lockfile; ohne `--with-deps`, das Abbild von GitHub
      # bringt mit, was Chromium braucht (Rocket, 1.10.2026).
      - name: playwright version
        id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: install browser
        working-directory: frontend
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: tour
        working-directory: frontend
        run: npx playwright test

      - name: logs on failure
        if: failure()
        run: |
          echo "── backend"; tail -80 "$RUNNER_TEMP/backend.log" || true
          echo "── frontend"; tail -40 "$RUNNER_TEMP/frontend.log" || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rundgang-bericht
          path: |
            frontend/e2e-bericht
            frontend/test-results
          retention-days: 7

  whisper-service:
    name: services/whisper · ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: install ruff
        run: pip install ruff

      - name: ruff
        working-directory: services/whisper
        run: ruff check . || true   # service is small; warn rather than block
