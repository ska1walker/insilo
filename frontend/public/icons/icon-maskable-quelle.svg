<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 160 160" fill="none" role="img" aria-label="Insilo">
<title>Insilo — Wappen, randlos für Android-Masken</title>
<!--
  Quelle: Figma AImighty, Datei vMiwfm3bnxWLjZLxdbDF8a, Knoten 301:164
  („Icon-Labor" › „Gold fuer die Anwender-Apps" › „app goldgrund I").

  Maskable-Fassung: ohne Eckenrundung und ohne Kante, weil Android auf
  beliebige Formen beschneidet und seine eigene Maske setzt. Eine
  Verkleinerung braucht es nicht — das Schild reicht nur bis 51 von 64
  erlaubten Einheiten vom Mittelpunkt und liegt damit im garantierten
  Innenkreis (80 % Durchmesser).
-->
