# ============================================================================
# OlaresManifest.yaml — Insilo
#
# Spec: https://docs.olares.com/developer/develop/package/manifest.html
# Spec-Version: 0.11.0
#
# Linter-Regeln (kritisch):
# - metadata.name, metadata.appid, Chart.yaml.name und Folder-Name MÜSSEN
#   alle exakt "insilo" sein (regex: ^[a-z0-9]{1,30}$, keine Bindestriche!)
# - metadata.version MUSS Chart.yaml.version matchen
# - spec.versionName MUSS Chart.yaml.appVersion matchen
# - requiredDisk MUSS gesetzt sein (regex: ^(?:\d+(?:\.\d+)?)[kKMGTP]?i?$)
# ============================================================================

olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

# Jedes Deployment, das dieses Chart rendert, mit seiner Replikatzahl.
# app-service steuert darüber den gesamten Lebenslauf: die Installation
# rendert zuerst mit 0 und skaliert dann hoch, Anhalten setzt alles auf 0,
# Fortsetzen zurück auf die hier genannten Werte. Steht die Zahl fest im
# Template, läuft das ins Leere.
workloadReplicas:
  insilo: 1
  insilo-backend: 1
  insilo-whisper: 1
  insilo-embeddings: 1
  insilo-worker: 1

metadata:
  name: insilo
  appid: insilo                # MUSS identisch zu metadata.name sein
  title: Insilo
  description: On-premise meeting intelligence — record, transcribe and summarize meetings without sending audio or notes to any cloud.
  icon: https://raw.githubusercontent.com/ska1walker/insilo/main/icon.png
  version: 0.1.98              # = Chart.yaml.version
  # Eine primäre Kategorie, wie es der AIMighty-Markt vorgibt. Die
  # frühere Dreierliste trug mit `Productivity_v112` einen Wert, den
  # dieser Markt ausdrücklich nicht mehr führt.
  categories:
    - AI

# ---- Entrances --------------------------------------------------------------
# Zwei Entrances: PWA (sichtbar) + Backend-API (invisible).
# Whisper, Ollama, Embeddings sind NICHT als Entrance deklariert — nur
# namespace-intern erreichbar.

entrances:
  - name: insilo                # MUSS metadata.name matchen (Marc's Gold-Standard-Regel)
    host: insilo                # = K8s-Service-Name (services.yaml + deployment.metadata.name)
    port: 3000
    title: Insilo
    icon: https://raw.githubusercontent.com/ska1walker/insilo/main/icon.png
    authLevel: internal         # LAN-User: kein Authelia-Prompt. Authelia nur bei Remote-Access (Tailscale/Cloudflare-Tunnel). Matches Marc's aimighty-apps pattern.
    invisible: false
    openMethod: window          # erlaubt Click → öffnet PWA in neuem Tab (sonst nur "running" State)

# Hinweis: api-Entrance wurde in v0.1.12 entfernt.
# Grund: Mit Entrance + Envoy-Sidecar interzepiert das Backend-Sidecar
# ALLE TCP-Inbounds und macht Authelia-Check. Interne Calls von Next.js
# (proxy via rewrites()) hatten dabei keine Authelia-Cookies und kriegten 401.
# Ohne api-Entrance läuft das Backend ohne Envoy-Sidecar (1/1 statt 2/2),
# Next.js Server-Proxy ruft direkt http://insilo-backend:8000, Backend
# liest X-Bfl-User-Header das Next.js aus der Frontend-Request weiterreicht.
#
# Der Preis dafür war lange offen: ohne Sidecar stand insilo-backend:8000
# JEDEM Pod im Cluster ungeprueft offen, und X-Bfl-User war frei
# behauptbar. Geschlossen wird das seit 0017 nicht durch eine Entrance,
# sondern durch ein gemeinsames Geheimnis (Secret insilo-internal): der
# Next.js-Server haengt es an, das Backend verlangt es, alles andere
# bekommt 401. Die Entrance bleibt aus dem oben genannten Grund draussen.

# ---- System-Middlewares ----------------------------------------------------
# Olares stellt Postgres + Redis (KVRocks) als geteilte System-Services bereit.
# Diese Block sagt Olares: "Lege mir bitte einen DB-User + Datenbank + Redis-
# Namespace an und reiche die Connection-Daten als .Values.postgres.* und
# .Values.redis.* in die Helm-Templates."

middleware:
  postgres:
    username: insilo
    databases:
      - name: insilo
        extensions:
          - vector       # pgvector — für BGE-M3 Embeddings (Phase 3)
          - pg_trgm      # Trigram-Suche
          - pgcrypto     # Verschlüsselte Felder
          - uuid-ossp    # UUID-Generierung
  redis:
    namespace: insilo    # Olares generiert das Passwort selbst und injiziert es als .Values.redis.password — KEIN `password:` Feld hier!

# ---- Berechtigungen ---------------------------------------------------------

permission:
  appCache: true                # für /app/cache (Whisper-Modelle, temp uploads)
  appData: true                 # für /app/data (Audio, persistente Daten)
  appCommon: true               # für /app/common (geteilter Ordner, Relay-Export)
  # userData: []                # MVP: kein Zugriff auf User-Home-Verzeichnis

  # Kein `provider`-Block: ab Schema 0.12.0 verbietet die Prüfung ihn, und
  # er hat ohnehin nie getragen — vor LiteLLM sitzt ein Envoy-Sidecar, der
  # einen Authelia-Token verlangt, den ein Server-zu-Server-Aufruf nicht
  # hat (auf der Box gemessen: 400 ohne Kopf, 401 mit X-Bfl-User). Der
  # Weg zum Sprachmodell führt über die öffentliche Adresse, die der
  # Nutzer unter /einstellungen einträgt.

# ---- Provider (für zukünftige Cross-App-Integration) -----------------------
# In Phase 5+ aktivieren, wenn CallList/andere kaivo-Apps auf Insilo zugreifen sollen.
# provider:
#   - name: insilo-meetings-api
#     entrance: insilo-backend
#     paths: ["/api/v1/meetings"]
#     verbs: ["GET"]

# ---- Spec ------------------------------------------------------------------

spec:
  versionName: '0.1.98'         # = Chart.yaml.appVersion (Marc's Golden Rule: identisch zu metadata.version)

  # Markt-Bilder: 1920×1080, erzeugt aus markt/vorlagen/ (siehe markt/README.md).
  featuredImage: https://raw.githubusercontent.com/ska1walker/insilo/main/markt/aufmacher.png
  promoteImage:
    - https://raw.githubusercontent.com/ska1walker/insilo/main/markt/01-besprechungen.png
    - https://raw.githubusercontent.com/ska1walker/insilo/main/markt/02-detail.png
    - https://raw.githubusercontent.com/ska1walker/insilo/main/markt/03-protokoll.png
    - https://raw.githubusercontent.com/ska1walker/insilo/main/markt/04-datenschutz.png
    - https://raw.githubusercontent.com/ska1walker/insilo/main/markt/05-papierkorb.png

  fullDescription: |
    **Insilo** is on-premise meeting intelligence for compliance-driven organizations.

    **What it does**
    - Records business meetings via a PWA (push-to-record or upload)
    - Transcribes audio locally with OpenAI Whisper (speaker diarization upcoming)
    - Generates structured summaries using a local LLM via the Olares LiteLLM gateway
    - Lets you ask follow-up questions across your entire meeting archive (RAG over pgvector embeddings)

    **The promise**
    Out of the box nothing leaves the machine: recording, transcription and search all run on it, with no cloud calls and no telemetry. Unlike PLAUD, Otter or Fireflies, anything that does leave is something you deliberately configured — a language model or a speech-recognition endpoint — and the app states measured what went where. The search index never leaves in any configuration.

    **Designed for**
    Law firms, tax consultancies, management consultants and German Mittelstand companies with strict compliance requirements (GDPR, BSI Grundschutz, attorney-client privilege).

    **Tech stack**
    - Frontend: Next.js 15 PWA
    - Backend: FastAPI + Celery
    - Transcription: faster-whisper (CPU-optimized)
    - LLM: routed through Olares LiteLLM gateway (Qwen, Llama, etc.)
    - Embeddings: BGE-M3 (multilingual)
    - Storage: PostgreSQL with pgvector + MinIO (provided by Olares)

    **Note**: First boot downloads ~3 GB of AI models from HuggingFace (Whisper + BGE-M3). After that, the app operates fully offline.

  upgradeDescription: |
    v0.1.98 — Lange Uploads kommen an, nichts wird doppelt angelegt.

    - Ein Upload, der länger als fünf Minuten dauerte, brach ab — etwa eine
      lange Besprechung über ein schwaches Mobilnetz. Jetzt haben Uploads
      bis zu zwei Stunden Zeit.
    - Der Upload geht mit festem, kleinem Puffer durch das Frontend. Bisher
      belegte eine Datei von 500 MB kurzzeitig ebenso viel Speicher; zwei
      gleichzeitig konnten das Frontend für alle abstürzen lassen.
    - „Erneut senden" legt keine zweite Besprechung an, wenn der erste
      Versuch doch angekommen war.
    - Das Datum einer Besprechung ist der Beginn der Aufnahme — auch wenn
      sie später gesendet wird. Eine hochgeladene Datei trägt das Datum aus
      ihrem Namen oder ihr Änderungsdatum.

    v0.1.97 — Vorhandene Aufnahmen hochladen, Fortschritt beim Senden.

    - Audiodatei hochladen: m4a, mp3, wav, ogg, webm, flac und aac bis
      500 MB, mit Vorlage und Aufnahmesprache wie bei einer Aufnahme. Auch
      eine über „Als Datei speichern" gesicherte Aufnahme lässt sich so
      wieder einspielen.
    - Beim Senden steht, wie weit es ist, statt minutenlang nur „Wird
      gespeichert".
    - Der Bildschirm bleibt wach, solange aufgenommen oder gesendet wird;
      ein gesperrtes Telefon hielt die Aufnahme sonst an.
    - Die Länge einer Besprechung kommt jetzt aus der Spracherkennung,
      nicht mehr aus dem Browser.
    - mp3, flac und aac wurden bisher unter falscher Endung abgelegt und
      ließen sich im Browser nicht abspielen. Zu große Dateien lehnt die
      Box jetzt ab, bevor sie etwas schreibt.

    v0.1.96 — Keine Aufnahme geht beim Senden mehr verloren.

    - Aufnahmen über etwa zehn Minuten kamen nicht auf der Box an: das
      Frontend schnitt sie bei 10 MB ab, und die Aufnahme war danach weg.
      Jetzt geht der Ton ungekürzt durch.
    - Jede Aufnahme wird während des Aufnehmens auf dem Gerät gesichert und
      erst gelöscht, wenn die Box sie angenommen hat. Scheitert das Senden,
      schließt sich der Tab oder stürzt er ab, bietet Insilo sie beim
      nächsten Öffnen an: erneut senden, als Datei speichern oder verwerfen.
    - Das Protokoll des Backends verzeichnet die Bereitschaftsprobe nicht
      mehr bei jedem Aufruf und reicht damit weiter zurück.

    v0.1.95 — Insilo lässt sich wieder auf bestehende Boxen aktualisieren.

    - 0.1.93 und 0.1.94 verlangten den gemeinsamen Ordner der Box. Den
      vergibt Olares aber nur bei der Installation — auf einer Box, auf
      der Insilo schon vorher lief, fehlte er, und das Update scheiterte.
      Jetzt bindet Insilo den Ordner nur ein, wenn Olares ihn bereitstellt.
      Fehlt er, bleibt der Export für andere Apps aus.

    v0.1.94 — Korrektur am Chart zu 0.1.93.

    - Insilo übernimmt beim Start nicht mehr den gemeinsamen Ordner der
      Box, sondern nur noch seinen eigenen Unterordner darin. 0.1.93 hat
      den obersten Ordner bei jedem Start sich selbst zugeschrieben —
      der gehört aber allen Apps, die ihn nutzen.

    v0.1.93 — Zusammenfassungen für andere Apps, zuerst für Relay.

    - Fertige Zusammenfassungen liegen zusätzlich im gemeinsamen Ordner
      der Box (/app/common/insilo-meetings). Relay liest sie dort und
      zeigt die Besprechungen in seinem eigenen Bereich. Der Wortlaut
      bleibt in Insilo.
    - Bitte beachten: das ist eingeschaltet und lässt sich derzeit nicht
      abschalten. Jede App mit Zugriff auf den gemeinsamen Ordner kann
      die Zusammenfassungen lesen. Die Box verlassen sie nicht, Insilo
      schon. Der Datenschutz-Nachweis zeigt den Ordner als eigenes Ziel.
    - Beim endgültigen Löschen verschwindet auch die Datei dort.
    - Den Nachzug für ältere Besprechungen dürfen nur Inhaber und
      Verwaltende anstoßen; er steht als Ausleitung im Protokoll.

    v0.1.92 — Nachbesserung zu 0.1.91.

    - Bei Besprechungen ohne Kurzfassung wurde die ganze Zusammenfassung
      eingeklappt und oben stand nichts. Jetzt wird nur eingeklappt, wenn
      oben auch etwas steht.
    - Die Werks-Vorlagen führen die Kurzfassung nun in ihrer eigenen
      Fassung mit, statt sie bei jedem Start zu verlieren.
  developer: kaivo.studio
  website: https://kaivo.studio
  sourceCode: https://github.com/ska1walker/insilo
  submitter: ska1walker
  locale:
    - en-US
    - de-DE
  doc: https://github.com/ska1walker/insilo#readme
  license:
    - text: Proprietary — kaivo.studio Commercial License
      url: https://kaivo.studio
  supportArch:
    - amd64

  # Note: `runAsInternal: true` was tried in v0.1.14 to grant cross-NS access
  # to the Olares LiteLLM gateway, but turned out to interact badly with the
  # frontend Envoy sidecar's check-auth init container. Sticking with normal
  # app scope — users who want a non-default LLM endpoint configure it via
  # the Einstellungen UI instead.

  # ---- Ressourcen-Anforderungen --------------------------------------------
  # Werden bei Installation reserviert.
  # LLM kommt via LiteLLM aus dem Olares-System (kein eigenes Ollama mehr),
  # daher deutlich schlanker als die ursprüngliche Schätzung.

  # WICHTIG: Diese Werte müssen die SUMME der Container-Ressourcen aus
  # olares/templates/deployment-*.yaml abdecken — der Markt rechnet beim
  # Upload nach und lehnt mit HTTP 400 ab, wenn eine Summe überschreitet
  # (gesehen bei v0.1.63). `bash scripts/check-chart.sh` prüft das lokal.
  # Bei Änderung an Container-resources hier mit nachziehen.
  #
  # Stand v0.1.64 — Summen aus helm template:
  #   requests: cpu 3750m, memory 8.5Gi   (whisper 2000m ist der Hauptposten)
  #   limits:   cpu 13000m, memory 21Gi   (whisper 6000m)
  requiredCpu: 4000m            # deckt requests-Summe 3750m
  requiredMemory: 12Gi          # deckt requests-Summe 8.5Gi
  requiredDisk: 30Gi            # Audio (~10 GB), Whisper-Modelle (~3 GB), DB-Anteil

  # ---- Ressourcen-Limits ---------------------------------------------------
  limitedCpu: 13000m            # deckt limits-Summe 13000m
  limitedMemory: 24Gi           # deckt limits-Summe 21Gi
  limitedDisk: 100Gi

# ---- Optionen ---------------------------------------------------------------

options:
  # System-Dependencies: unterstützte Olares-Version.
  #
  # MUSS ein beidseitig geschlossenes Intervall sein — ein offenes '>=x.y.z'
  # wird vom Markt-Upload mit HTTP 400 abgelehnt ("must restrict the Olares
  # system version to ...", gesehen bei v0.1.61). Der Markt gibt die zulässige
  # Spanne für die jeweilige apiVersion vor; bei Ablehnung nennt die
  # Fehlermeldung das erwartete Intervall — das dann hier eintragen.
  # Das '-0'-Suffix schließt Pre-Releases von 1.12.3 ein (semver-Konvention).
  dependencies:
    - name: olares
      type: system
      version: '>=1.12.6-0'

  # Erlaubt mehrere isolierte Instanzen (z.B. eine pro Mandant) — MVP: nein
  allowMultipleInstall: false

  # Erlaubte ausgehende Netzwerkverbindungen: nur HTTPS (443) für den
  # einmaligen HuggingFace-Modell-Download beim Erst-Start (Whisper + BGE-M3).
  # Nach dem Cache-Warm-up läuft die App vollständig offline. Audio, Transkripte
  # und Embeddings verlassen nie die Box — der einzige Outbound ist der Modell-Pull.
  allowedOutboundPorts:
    - 443

  # Sicherheits-Kontext: niemals als root laufen
  runAsUser: "1000"

  # Scope: per-user installiert (nicht cluster-shared). Olares setzt damit
  # automatisch das bytetrade.io/ns-owner=<username> Label auf den Namespace,
  # wodurch die NetworkPolicy-Selektoren in user-system-* unsere Pods
  # zur Authelia/IAM/Redis-/Postgres-Kommunikation zulassen. Ohne diesen
  # Block kriegen wir nur die generische `others-np` NetworkPolicy und
  # check-auth findet die System-Services nicht.
  appScope:
    clusterScoped: false
