{{- /*
Gemeinsames Geheimnis zwischen Frontend und Backend.

Das Backend hat bewusst keine Entrance und damit keinen Envoy-Sidecar
(Begründung im OlaresManifest, Abschnitt entrances). Damit stand
`insilo-backend:8000` jedem Pod im Cluster offen, und `X-Bfl-User` war
frei behauptbar. Dieses Geheimnis ist der Torwächter, den es dort
seither nicht gab.

Der Wert wird bei jedem Rendern neu gewürfelt. Das ist unkritisch, weil
beide Deployments ihn über `secretKeyRef` aus **derselben** Ressource
lesen — sie können nicht auseinanderlaufen. Damit ein neuer Wert auch
wirklich ankommt, tragen beide Pod-Vorlagen eine Prüfsumme dieser Datei;
ohne sie behielten laufende Pods den alten Wert im Speicher und der
nächste Neustart eines einzelnen Pods würde 401 liefern.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: insilo-internal
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  token: {{ randAlphaNum 48 | quote }}
