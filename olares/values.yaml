# Replikatzahlen je Workload. Olares überschreibt sie zur Laufzeit
# (Installation, Anhalten, Fortsetzen) — die Templates lesen ausschließlich
# von hier, nie eine feste Zahl.
workloads:
  "insilo":
    replicaCount: 1
  "insilo-backend":
    replicaCount: 1
  "insilo-whisper":
    replicaCount: 1
  "insilo-embeddings":
    replicaCount: 1
  "insilo-worker":
    replicaCount: 1

# ============================================================================
# values.yaml — Default Helm Values für Insilo
#
# Diese Werte können beim Helm-Install per --set überschrieben werden.
# Olares injiziert zusätzlich automatisch:
#   .Values.bfl.username
#   .Values.user.zone
#   .Values.userspace.appData / appCache / userData
#   .Values.postgres.*   (wenn middleware: postgres deklariert)
#   .Values.redis.*      (wenn middleware: redis deklariert)
#   .Values.cluster.arch
# ============================================================================

# ---- Image-Konfiguration ---------------------------------------------------

images:
  frontend:
    repository: ghcr.io/ska1walker/insilo-frontend
    tag: 0.1.77
    pullPolicy: IfNotPresent

  backend:
    repository: ghcr.io/ska1walker/insilo-backend
    tag: 0.1.77
    pullPolicy: IfNotPresent

  whisper:
    repository: ghcr.io/ska1walker/insilo-whisper
    tag: 0.1.77
    pullPolicy: IfNotPresent

  embeddings:
    repository: ghcr.io/ska1walker/insilo-embeddings
    tag: 0.1.77
    pullPolicy: IfNotPresent

# ---- KI-Modelle ------------------------------------------------------------
# Insilo bringt nur Whisper + BGE-M3 selbst mit. Das LLM nutzen wir aus
# der LiteLLM-Gateway-App von Olares (siehe `litellm:` unten). Damit kommt
# die Insilo-VRAM-Anforderung auf ~3 GB (nur Whisper auf GPU).

models:
  whisper: large-v3
  embeddings: BAAI/bge-m3

# ---- Whisper-Service-Tuning ------------------------------------------------
# beamSize 1 = fastest, 5 = standard-quality (default since v0.1.49).
# Bumps decoder beam search width — measurably better recognition,
# especially for German compounds. Trade-off: ~2-3x slower on CPU.
# Override emergency: helm upgrade --set whisper.beamSize=1
whisper:
  beamSize: 5

# ---- LLM-Gateway (LiteLLM auf Olares) ---------------------------------------
# Zugang zum Sprachmodell. Alle drei Felder sind bewusst leer — dieses
# Chart wird veröffentlicht, und was hier steht, steht öffentlich.

# ---- Spracherkennung -------------------------------------------------------
# Vorgabe: leer. Dann übernimmt der mitgelieferte Whisper-Dienst und keine
# Tonaufnahme verlässt die Box — das ist der datensparsamste Zustand und
# der einzige, in dem die Zusage ohne Einschränkung gilt.
#
# Ein Eintrag hier schaltet auf einen OpenAI-kompatiblen STT-Server um.
# Auf einer Adresse derselben Box (z. B. https://speaches.<zone>/v1) bleibt
# das Audio auf der Maschine; bei einem fremden Anbieter nicht, und der
# Datenschutz-Nachweis sagt das dann auch.
stt:
  baseUrl: ""
  apiKey: ""
  model: ""

litellm:
  # Adresse der LiteLLM-Instanz. Leer lassen — sie lässt sich nicht
  # vorhersagen: die Olares-App-Kennung wird erst bei der Installation von
  # LiteLLM vergeben (die öffentliche Adresse lautet dann
  # `https://<kennung>.<zone>`), ein eigener Alias ist frei gewählt, und
  # der clusterinterne Dienst antwortet nicht — davor sitzt ein
  # Envoy-Sidecar, der einen Authelia-Token verlangt, den ein
  # Server-zu-Server-Aufruf nicht hat.
  # Der Nutzer trägt die Adresse unter /einstellungen ein. Wer sie beim
  # Installieren schon kennt: `--set litellm.baseUrl=https://…/v1`.
  baseUrl: ""
  # Kein Vorgabe-Schlüssel. Bis v0.1.74 stand hier LiteLLMs bekannter
  # `sk-1234`-Master-Key — in einem öffentlichen Katalog ist ein
  # eingebackener Schlüssel das falsche Signal, und seit v0.1.72 gibt es
  # ohnehin keine Vorgabe-Adresse mehr, zu der er passen würde. Lokale
  # Endpunkte verlangen keinen Schlüssel; wer einen braucht, trägt ihn
  # unter /einstellungen ein oder gibt ihn beim Installieren mit
  # (`--set litellm.apiKey=...`).
  apiKey: ""
  # Modellname wie er beim Endpunkt registriert ist. Leer = der Nutzer
  # trägt ihn ein; jede Vorgabe wäre bei einem anderen Endpunkt falsch.
  model: ""

# ---- Anwendungskonfiguration -----------------------------------------------

app:
  language: de
  defaultTimezone: Europe/Berlin
  audioRetentionDays: 90
  softDeleteRetentionDays: 30
  maxUploadSizeMb: 500
