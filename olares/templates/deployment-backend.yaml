# ============================================================================
# Deployment: Insilo Backend (FastAPI)
#
# Wichtig: Backend nutzt Olares-System-PostgreSQL und -KVRocks.
# Die Variablen .Values.postgres.* und .Values.redis.* werden automatisch
# injiziert, sobald middleware: postgres / redis im OlaresManifest deklariert ist.
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: insilo-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: insilo
    component: backend
spec:
  replicas: {{ (index .Values.workloads "insilo-backend").replicaCount }}
  # Recreate, nicht RollingUpdate: dieses Deployment mountet hostPath
  # (/app/data, /app/cache). Bei RollingUpdate liefen kurzzeitig zwei Pods
  # auf demselben Host-Verzeichnis. Der Olares-Markt lehnt die Kombination
  # hostPath + RollingUpdate beim Upload ab (HTTP 400, gesehen bei v0.1.62).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: insilo
      component: backend
  template:
    metadata:
      annotations:
        # Zwingt beide Pods zum Neustart, wenn sich das gemeinsame
        # Geheimnis ändert. Ohne das behielten sie den alten Wert und
        # der nächste Einzelneustart liefe in 401.
        checksum/insilo-internal: {{ include "insilo.internalChecksum" . }}
      labels:
        app: insilo
        component: backend
    spec:
      initContainers:
        # See deployment-worker.yaml for why this is needed.
        - name: init-chown
          image: docker.io/beclab/aboveos-busybox:1.37.0
          command: ['sh', '-c', 'chown -R 1000:1000 /app/cache /app/data']
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: app-cache
              mountPath: /app/cache
            - name: app-data
              mountPath: /app/data

        # Applies schema + seed against the Olares-provided Postgres. Runs
        # with a retry loop so the natural pod-restart cycle covers the
        # window before Olares finishes setting `bytetrade.io/ns-owner` on
        # our namespace (the label that unblocks the cross-NS NetworkPolicy
        # to the DB). Each SQL file is sent as a single asyncpg execute()
        # call = one implicit transaction. Idempotent (CREATE TABLE IF NOT
        # EXISTS, ON CONFLICT DO NOTHING), so re-running on every restart
        # is safe.
        - name: migrate
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          env:
            - name: DB_HOST
              value: "{{ .Values.postgres.host }}"
            - name: DB_PORT
              value: "{{ .Values.postgres.port }}"
            - name: DB_USER
              value: "{{ .Values.postgres.username }}"
            - name: DB_PASSWORD
              value: "{{ .Values.postgres.password }}"
            - name: DB_NAME
              value: "{{ .Values.postgres.databases.insilo }}"
          command:
            - python3
            - -c
            - |
              import asyncio, asyncpg, glob, os, sys
              from asyncpg.exceptions import (
                  DuplicateColumnError, DuplicateObjectError, DuplicateSchemaError,
                  DuplicateTableError, UniqueViolationError,
              )

              # Errors that mean "this migration was already applied" — safe to skip
              # the rest of the file. seed.sql uses ON CONFLICT DO NOTHING so it
              # never hits these; only schema files do.
              SKIPPABLE = (
                  DuplicateColumnError, DuplicateObjectError, DuplicateSchemaError,
                  DuplicateTableError, UniqueViolationError,
              )

              async def connect_with_retry(attempts: int = 60, delay: float = 5.0):
                  last = None
                  for i in range(1, attempts + 1):
                      try:
                          return await asyncpg.connect(
                              host=os.environ["DB_HOST"],
                              port=int(os.environ["DB_PORT"]),
                              user=os.environ["DB_USER"],
                              password=os.environ["DB_PASSWORD"],
                              database=os.environ["DB_NAME"],
                              timeout=4,
                          )
                      except Exception as exc:
                          last = exc
                          print(f"  attempt {i}/{attempts}: {type(exc).__name__}: {exc}", flush=True)
                          await asyncio.sleep(delay)
                  raise last

              async def main():
                  print("Waiting for Postgres at "
                        f"{os.environ['DB_HOST']}:{os.environ['DB_PORT']} "
                        f"as {os.environ['DB_USER']}...", flush=True)
                  conn = await connect_with_retry()
                  print("Connected.", flush=True)
                  try:
                      for path in sorted(glob.glob("/sql/*.sql")):
                          print(f"Applying {path}...", flush=True)
                          with open(path) as fp:
                              sql = fp.read()
                          try:
                              await conn.execute(sql)
                              print(f"  ok ({len(sql)} bytes)", flush=True)
                          except SKIPPABLE as exc:
                              # The implicit transaction is already rolled back —
                              # treat the whole file as "previously applied" and
                              # move on. (Our migrations are append-only, so this
                              # is the correct behaviour: a new 0NNN file will
                              # still hit fresh statements and apply.)
                              print(f"  skip (already applied): "
                                    f"{type(exc).__name__}: {exc}", flush=True)
                  finally:
                      await conn.close()
                  print("Migrations complete.", flush=True)

              try:
                  asyncio.run(main())
              except Exception as exc:
                  print(f"FAILED: {exc}", flush=True)
                  sys.exit(1)
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      containers:
        - name: backend
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
          ports:
            - containerPort: 8000
              name: http
          env:
            # ---- PostgreSQL (Olares-System-Middleware) ----------------------
            - name: DB_HOST
              value: "{{ .Values.postgres.host }}"
            - name: DB_PORT
              value: "{{ .Values.postgres.port }}"
            - name: DB_USER
              value: "{{ .Values.postgres.username }}"
            - name: DB_PASSWORD
              value: "{{ .Values.postgres.password }}"
            - name: DB_NAME
              value: "{{ .Values.postgres.databases.insilo }}"

            # ---- KVRocks/Redis (Olares-System-Middleware) -------------------
            - name: REDIS_HOST
              value: "{{ .Values.redis.host }}"
            - name: REDIS_PORT
              value: "{{ .Values.redis.port }}"
            - name: REDIS_PASSWORD
              value: "{{ .Values.redis.password }}"
            - name: REDIS_NAMESPACE
              value: "{{ .Values.redis.namespace }}"

            # ---- Interne KI-Service-URLs ------------------------------------
            - name: WHISPER_URL
              value: "http://insilo-whisper:8001"
            # LLM via the shared Olares LiteLLM gateway (OpenAI-compatible).
            # Saves us a 4-GB Ollama image + a GPU slot, and pools the LLM
            # across all kaivo apps on the box.
            # Bewusst leer: die clusterinterne LiteLLM-Adresse antwortet
            # nicht (Envoy davor verlangt einen Authelia-Token), und die
            # öffentliche Adresse hängt an der App-Kennung, die erst bei
            # der Installation von LiteLLM vergeben wird. Der Nutzer trägt
            # sie unter /einstellungen ein; bis dahin meldet die App das
            # offen, statt einen Endpunkt anzusprechen, den es nicht gibt.
            - name: LLM_BASE_URL
              value: "{{ .Values.litellm.baseUrl }}"
            - name: LLM_API_KEY
              value: "{{ .Values.litellm.apiKey }}"
            - name: LLM_MODEL
              value: "{{ .Values.litellm.model }}"
            - name: EMBEDDINGS_URL
              value: "http://insilo-embeddings:8002"

            # ---- Spracherkennung ---------------------------------------------
            # Leer und das bleibt auch so: dann transkribiert der
            # mitgelieferte Whisper-Dienst, und die Tonaufnahme verlässt die
            # Box nicht. Wer einen OpenAI-kompatiblen STT-Server bevorzugt
            # (z. B. Speaches auf derselben Box), trägt ihn unter
            # /einstellungen ein — der Datenschutz-Nachweis benennt ihn dann.
            # Kein direkter Punktzugriff, und das ist keine Stilfrage: ein
            # Upgrade spielt die beim Installieren gespeicherten Werte
            # zurück und mischt die Vorgaben des NEUEN Charts nicht ein.
            # Ein Schlüssel, den es in der Vorversion noch nicht gab,
            # fehlt dann schlicht — `.Values.stt.baseUrl` stirbt mit
            # „nil pointer evaluating interface {}.baseUrl", und das
            # Upgrade scheitert, bevor irgendetwas passiert (so geschehen
            # bei v0.1.77 über den Markt). `default (dict)` fängt den
            # fehlenden Block ab. `dig` wäre der naheliegende Weg, kann
            # aber nicht auf `.Values` — das ist chartutil.Values, keine
            # einfache Map. Für jeden künftig neuen Wertschlüssel genauso.
            - name: STT_BASE_URL
              value: "{{ (default (dict) .Values.stt).baseUrl | default "" }}"
            - name: STT_API_KEY
              value: "{{ (default (dict) .Values.stt).apiKey | default "" }}"
            - name: STT_MODEL
              value: "{{ (default (dict) .Values.stt).model | default "" }}"

            # ---- Storage-Pfade ----------------------------------------------
            - name: APP_DATA_DIR
              value: "{{ .Values.userspace.appData }}"
            - name: APP_CACHE_DIR
              value: "{{ .Values.userspace.appCache }}"

            # ---- Storage-Backend --------------------------------------------
            # "local" → Audio landet auf hostPath unter /app/data/audio/...
            # "minio" wäre der S3-API-Backend, ist auf Olares aber Cross-NS-
            # blockiert (siehe HANDOFF.md §Phase-4c).
            - name: STORAGE_BACKEND
              value: "local"
            - name: STORAGE_LOCAL_PATH
              value: "/app/data/audio"

            # ---- App-Konfiguration ------------------------------------------
            - name: APP_LANG
              value: "{{ .Values.app.language }}"
            - name: APP_TIMEZONE
              value: "{{ .Values.app.defaultTimezone }}"
            - name: AUDIO_RETENTION_DAYS
              value: "{{ .Values.app.audioRetentionDays }}"
            - name: MAX_UPLOAD_MB
              value: "{{ .Values.app.maxUploadSizeMb }}"

            # ---- Olares-Kontext ---------------------------------------------
            # Die Benutzeridentität kommt pro Anfrage aus dem X-Bfl-User-Kopf;
            # eine Umgebungsvariable dafür wurde nie gelesen und ist entfallen
            # (apiVersion=v3 verbietet dieses Namenspräfix in Chart-Dateien
            # ohnehin — der Prüfer sucht die Zeichenkette im Dateitext, also
            # steht sie auch in keinem Kommentar mehr).
            # OLARES_ZONE bleibt: daran erkennt der Datenschutz-Nachweis die
            # eigene Box.
            - name: OLARES_ZONE
              value: "{{ .Values.user.zone }}"
            # Gemeinsames Geheimnis — der Torwächter vor dem Backend.
            - name: INSILO_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: insilo-internal
                  key: token

          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: app-cache
              mountPath: /app/cache

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

      volumes:
        - name: app-data
          hostPath:
            path: {{ .Values.userspace.appData }}
            type: DirectoryOrCreate
        - name: app-cache
          hostPath:
            path: {{ .Values.userspace.appCache }}
            type: DirectoryOrCreate
        - name: sql
          configMap:
            name: insilo-migrations
